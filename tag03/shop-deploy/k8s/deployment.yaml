apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-worker}
  template:
    metadata:
      labels: {app: shop-worker}
    spec:
      containers:
        - name: worker
          image: busybox:1.36.0
          command: ["sh", "-c", "sleep 3600"]
